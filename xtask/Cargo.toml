[package]
name = "xtask"
description = "Repository automation: architecture rules and benchmark regression gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cargo_metadata.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# xtask is tooling: printing is its user interface.
print_stdout = "allow"
print_stderr = "allow"
