# char(n) values against Trino 431: the CH red-team probes (hive tables Trino wrote),
# the wrong-result shapes of ISS-025 and the W1 verdict probes (in-memory tables).
# main refuses many char comparisons until ISS-024 lands: those are known, not green.

oracle = "trino"
setup = [
  "CREATE SCHEMA {c}.chp",
  "CREATE TABLE {c}.chp.t (id bigint, ch char(5), c3 char(3), v varchar, v3 varchar(3))",
  "INSERT INTO {c}.chp.t VALUES (1, 'ab', 'ab', 'ab', 'ab'), (2, 'ab  ', 'a', 'ab  ', 'a  '), (3, NULL, NULL, NULL, NULL), (4, 'zz', 'zz ', 'zz', 'z'), (5, 'a', 'a', 'a' || chr(9), 'a'), (6, 'é', 'é', 'é', 'é'), (7, '', '', '', '')",
  "CREATE TABLE {c}.chp.u (k char(4), n bigint)",
  "INSERT INTO {c}.chp.u VALUES ('ab', 10), ('a', 20), ('zz', 30), (NULL, 40), ('x', 50)",
  "CREATE TABLE {c}.chp.u2 (k varchar, n bigint)",
  "INSERT INTO {c}.chp.u2 VALUES ('ab', 10), ('a', 20), ('zz', 30)",
]
setup_trino = [
  "CREATE SCHEMA hive.chs",
  "CREATE TABLE hive.chs.cht (id bigint, ch char(5)) WITH (format = 'PARQUET')",
  "INSERT INTO hive.chs.cht VALUES (1, 'ab'), (2, 'zz')",
  "CREATE TABLE hive.chs.vct (id bigint, ch varchar) WITH (format = 'PARQUET')",
  "INSERT INTO hive.chs.vct VALUES (1, 'ab'), (3, 'cd')",
]

