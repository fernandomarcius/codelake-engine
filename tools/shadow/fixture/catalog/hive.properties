# Parquet warehouse in the file-metastore layout. Each engine mounts its own
# directory at /warehouse: the two sides never write to the same place.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=file:/warehouse
hive.storage-format=PARQUET
# INT96 timestamps: both engines convert with this zone (a non-UTC zone, so a
# mismatch between the engines would show as shifted values).
hive.parquet.time-zone=America/Sao_Paulo
hive.security=allow-all
