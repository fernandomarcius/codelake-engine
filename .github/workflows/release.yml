# Release: one immutable, signed image per tag, with SBOM and SLSA provenance.
# The digest produced here is the one promoted HML -> PRD; nothing is rebuilt.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write        # attach SBOM to the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # keyless signing (Sigstore) and provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/toolbelt
        with: { cache-key: release }
      - name: Every gate again on the tagged commit
        run: |
          scripts/dev.sh scripts/gates.sh fast
          scripts/dev.sh scripts/gates.sh integration
      - name: Rust SBOM (CycloneDX)
        run: scripts/dev.sh scripts/gates.sh sbom
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - name: Block release on CRITICAL/HIGH vulnerabilities in the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish SBOM and digest on the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${IMAGE}@${{ steps.build.outputs.digest }}" > image-digest.txt
          gh release create "${{ github.ref_name }}" --generate-notes --verify-tag \
            image-digest.txt crates/*/sbom.json
