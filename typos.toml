[default]
# Git commit hashes (benchmark baselines and reports are named after them) and
# the W3C Trace Context specification's example `tracestate` value.
extend-ignore-re = ["\\b[0-9a-f]{12}(-dirty)?\\b", "00f067aa0ba902b7"]

[default.extend-words]
# Portuguese words used in docs.
# A table of the reference use case (shadow run issues).
depositos = "depositos"
# the reporting application: an application of the installation (the D4 replay, ISS-066).
Controle = "Controle"
# Names of the ERP's columns and of the app that reads them (`Cliente_Rec`,
# `Itens_Proc`, the reporting application), reproduced by the federated join tests.
cliente = "cliente"
controle = "controle"
itens = "itens"
# ERRO: outcome of the differential gate (both engines refused, different errors).
ERRO = "ERRO"
# A deliberate syntax error in the Trino protocol tests (`SELEC 1`).
SELEC = "SELEC"
# JDBC `DatabaseMetaData` column names (`TABLE_SCHEM`), kept by Trino's `system.jdbc`.
schem = "schem"
# The `flate2` crate (zlib bindings), named in the Dockerfile.
flate = "flate"
[files]
# docs/requirements/GOAL.md is an internal document written in Portuguese.
# Test fixtures are generated by real systems and contain Portuguese data.
# vendor/: third-party sources kept as published (vendor/*/PATCHES.md).
extend-exclude = ["Cargo.lock", "LICENSE", "*.svg", "docs/requirements/GOAL.md", "crates/*/tests/fixtures", "vendor"]
