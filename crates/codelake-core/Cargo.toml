[package]
name = "codelake-core"
description = "Engine core: configuration, memory governance and connector contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# `crate::portable`: a datafusion-proto codec for the core's plans and
# functions, for distributed execution (M4). Only the codec, never the
# distributed layer (cargo xtask arch).
portable = ["dep:datafusion-proto", "dep:prost"]

[dependencies]
datafusion-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
datafusion.workspace = true
datafusion-federation.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
metrics.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
secrecy.workspace = true
tracing.workspace = true
chrono-tz.workspace = true
regex.workspace = true
fancy-regex.workspace = true
num-traits.workspace = true
twox-hash.workspace = true
md5.workspace = true
sha1.workspace = true
sha2.workspace = true
crc32fast.workspace = true
base64.workspace = true
serde_json.workspace = true
uuid.workspace = true
libm.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tokio.workspace = true
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "query_memory"
harness = false

[lints]
workspace = true
