[package]
name = "codelake-server"
description = "CodeLake server: PostgreSQL wire protocol plus operational HTTP endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Distributed execution (M4, ADR 0011): coordinator planner and worker mode.
distributed = ["dep:datafusion-distributed", "dep:tonic", "dep:url", "codelake-core/portable"]

[[bin]]
name = "codelake"
path = "src/main.rs"

[dependencies]
codelake-core.workspace = true
codelake-connectors.workspace = true
datafusion.workspace = true
datafusion-postgres.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body.workspace = true
tower-service.workspace = true
# Open-files limit and TCP keepalive without `unsafe` (ADR 0018).
rustix = { workspace = true, features = ["process", "net"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
secrecy.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
thiserror.workspace = true
futures.workspace = true
uuid.workspace = true
base64.workspace = true
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true
datafusion-distributed = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
# TPC-H rows (the dbgen algorithm) for the distributed tests; no arrow dependency.
tpchgen = "=3.0.0"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
tiberius.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

[lints]
workspace = true
