[default]
# Git commit hashes (benchmark baselines and reports are named after them).
extend-ignore-re = ["\\b[0-9a-f]{12}(-dirty)?\\b"]

[default.extend-words]
# Portuguese words used in docs.
[files]
# docs/requirements/GOAL.md is an internal document written in Portuguese.
# Test fixtures are generated by real systems and contain Portuguese data.
extend-exclude = ["Cargo.lock", "LICENSE", "*.svg", "docs/requirements/GOAL.md", "crates/*/tests/fixtures"]
