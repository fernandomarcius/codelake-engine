# Same metastore layout as the production warehouses (ADR 0007).
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=file:/warehouse
hive.security=allow-all
# INT96 timestamps in the zone CodeLake's hive catalogs use by default
# (parquet_time_zone, ADR 0007); the image's own default is UTC.
hive.parquet.time-zone=America/Sao_Paulo
