# SQL Server with CDC, read by both engines. The password comes from the
# environment on both sides: the reference engine resolves ${ENV:…} itself,
# and `codelake config import` turns it into `password_env`.
connector.name=sqlserver
connection-url=jdbc:sqlserver://shadow-mssql:1433;databaseName=shadow;encrypt=false
connection-user=sa
connection-password=${ENV:MSSQL_SA_PASSWORD}
