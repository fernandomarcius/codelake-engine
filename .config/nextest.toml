# Unit tests are the fast lane (no Docker). Integration tests live in `tests/`
# directories and need Docker; they run in the `integration` profile.
[profile.default]
default-filter = "not kind(test)"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.integration]
default-filter = "kind(test)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
# Containers are heavy; do not start dozens at once.
test-threads = 4

[profile.ci]
fail-fast = false
[profile.ci.junit]
path = "junit.xml"
