# Example configuration. Secrets are NEVER written here: each source names the
# environment variable that holds its secret. Any string value may reference
# the environment as ${ENV:NAME}, resolved at load, e.g.
# host = "${ENV:ERP_HOST}". Validate with:
#   codelake check-config --config examples/codelake.toml

[server]
pg_listen = "127.0.0.1:5432"
http_listen = "0.0.0.0:8080"
max_connections = 128
shutdown_grace_secs = 30

[memory]
# Hard ceiling for query memory. Keep it ~75% of the container memory limit to
# leave room for the allocator, connection buffers and metadata.
limit = "3GiB"
spill_dir = "/var/lib/codelake/spill"
spill_limit = "40GiB"

[execution]
batch_size = 8192
source_startup_timeout_secs = 60

# Query governance (docs/adr/0016-query-governance.md), for every client
# protocol, with the user each client names. Defaults shown.
# [governance]
# max_running_queries = 32
# max_queued_queries = 1000        # beyond it: QUERY_QUEUE_FULL / SQLSTATE 53400
# max_running_per_user = 16
# max_queued_per_user = 500
# queue_timeout_secs = 600
# query_max_run_time = "100d"      # session default; from submission
# query_max_execution_time = "100d" # session default; from admission
# history_size = 100               # completed queries in system.runtime.queries
# history_retention_secs = 900
#
# [[governance.resource_group]]
# name = "etl"
# users = ["dbt"]                  # or user_pattern / source_pattern (regex)
# max_running = 4
# max_queued = 100

# Distributed tracing (docs/adr/0010-observability-otlp.md). Off unless
# otlp_endpoint is set. OTLP/HTTP protobuf to a collector agent on the node or
# in the pod (plain http://; the agent handles TLS upstream).
# [telemetry]
# otlp_endpoint = "http://otel-collector:4318"
# service_name = "codelake"
# sampling_ratio = 0.1        # new traces; a caller's traceparent decides for its own
# export_timeout_secs = 10

[[source]]
name = "erp"
kind = "postgres"
host = "postgres.internal"
database = "erp"
user = "codelake_reader"
password_env = "ERP_PG_PASSWORD"
sslmode = "verify-full"

[[source]]
name = "crm"
kind = "mysql"
host = "mysql.internal"
database = "crm"
user = "codelake_reader"
password_env = "CRM_MYSQL_PASSWORD"

[[source]]
name = "events"
kind = "mongodb"
required = false
connection_string_env = "EVENTS_MONGO_URI"

# Iceberg is not compiled into this build (ADR 0013): a required `iceberg`
# source stops the server at startup. Uncomment once the connector returns.
# [[source]]
# name = "lake"
# kind = "iceberg"
# catalog_uri = "http://iceberg-rest:8181"
# warehouse = "s3://lake"
# s3_endpoint = "http://minio:9000"
# s3_path_style = true
# access_key_id_env = "LAKE_ACCESS_KEY_ID"
# secret_access_key_env = "LAKE_SECRET_ACCESS_KEY"
