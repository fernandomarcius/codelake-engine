# Stable names (codelake-worker-0.codelake-worker) are what the coordinator's
# `distributed.workers` lists; scale both together.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: codelake-worker
  labels: { app.kubernetes.io/name: codelake, app.kubernetes.io/component: worker }
spec:
  serviceName: codelake-worker
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: codelake, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: codelake, app.kubernetes.io/component: worker }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: codelake
          image: codelake
          args: ["serve", "--config", "/etc/codelake/codelake.toml"]
          ports:
            - { name: worker, containerPort: 50051 }
            - { name: http, containerPort: 8080 }
          resources:
            # Guaranteed: the memory ceiling is the container limit (ADR 0003).
            requests: { cpu: "8", memory: 32Gi }
            limits: { cpu: "8", memory: 32Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          volumeMounts:
            - { name: config, mountPath: /etc/codelake, readOnly: true }
            - { name: warehouse, mountPath: /warehouse, readOnly: true }
            - { name: spill, mountPath: /var/lib/codelake/spill }
      volumes:
        - { name: config, configMap: { name: codelake-worker } }
        - { name: warehouse, persistentVolumeClaim: { claimName: codelake-warehouse, readOnly: true } }
        - { name: spill, emptyDir: { sizeLimit: 150Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: codelake-worker
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: codelake, app.kubernetes.io/component: worker }
  ports:
    - { name: worker, port: 50051 }
