[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz", "vendor"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/fernandomarcius/codelake-engine"
authors = ["CodeLake contributors"]
publish = false

# DataFusion "version train" (see docs/adr/0002-datafusion-version-train.md).
# Every crate below that links DataFusion MUST resolve to the same major.
# Bumping DataFusion means bumping this whole block together, never one line.
[workspace.dependencies]
# `~54.1`: the train is DataFusion 54.1.x; a 54.2 is a train change (ADR 0002).
datafusion = { version = "~54.1", default-features = false, features = [
  "nested_expressions",
  "datetime_expressions",
  "string_expressions",
  "unicode_expressions",
  "regex_expressions",
  "crypto_expressions",
  "parquet",
] }
# Exact pin: the table-provider crates ask for ^0.5.5 and 0.5.7 already needs
# DataFusion 55; only one 0.5.x may be in the graph.
datafusion-federation = { version = "=0.5.5", features = ["sql"] }
# One crate per connector since 0.13. `default-features = false` on purpose:
# `federation` moved from the facade to these crates and is enabled per
# connector in crates/codelake-connectors/Cargo.toml (MongoDB stays unfederated).
datafusion-table-providers-common = { version = "=0.13.1", default-features = false }
datafusion-table-providers-postgres = { version = "=0.13.1", default-features = false }
datafusion-table-providers-mysql = { version = "=0.13.1", default-features = false }
datafusion-table-providers-mongodb = { version = "=0.13.1", default-features = false }
# Distributed execution (M4, ADR 0011): exact pins, part of the train block.
# datafusion-distributed 3.0.0 is the last release on DataFusion 54.
datafusion-distributed = { version = "=3.0.0", default-features = false, features = ["grpc", "parquet", "sql"] }
datafusion-proto = { version = "=54.1.0", default-features = false }
# The worker service is a tonic server (datafusion-distributed's transport).
tonic = { version = "0.14", default-features = false, features = ["transport"] }
url = "2.5"
# Encoding of the core's plan codec (the version datafusion-proto uses).
prost = { version = "0.14", default-features = false, features = ["std"] }
# Iceberg is out of the build: no iceberg-datafusion release targets
# DataFusion 54 (docs/adr/0013-iceberg-out-of-the-datafusion-54-train.md).
datafusion-postgres = "=0.18.0"

# Internal crates
codelake-core = { path = "crates/codelake-core" }
codelake-connectors = { path = "crates/codelake-connectors" }

# SQL Server (TDS). native-tls: old SQL Server builds only negotiate TLS 1.0/1.1,
# which rustls refuses.
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls"] }
bb8 = "0.9"
# PostgreSQL connections of the connector's own pool (the upstream pool sets a
# Redshift parameter PostgreSQL refuses, ISS-060); versions already in the graph.
bb8-postgres = "0.9"
postgres-native-tls = "0.5"
native-tls = "0.2"

# Hive catalog (Trino file metastore layout)
object_store = { version = "0.13", default-features = false, features = ["fs"] }
crc32fast = "1.5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
bytes = "1"
# Atomic exchange of two directories (renameat2 RENAME_EXCHANGE) for
# CREATE OR REPLACE TABLE, without `unsafe`.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

# Trino function library (versions already in the graph through DataFusion)
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
regex = "1.13"
# Look-around and back-references of Trino (Joni) patterns; the `regex`
# engine above keeps every other pattern (ADR 0008).
fancy-regex = "0.19"
num-traits = "0.2.19"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64", "std"] }
md5 = { package = "md-5", version = "0.10.6" }
sha1 = "0.11.0"
sha2 = "0.10.9"
libm = "0.2.16"
unicode-normalization = "0.1.25"

# Runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
# The HTTP listeners' connection loop (idle and header-read timeouts, connection
# limits; ADR 0018): the versions axum already brings.
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http-body = "1.0"
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1.1"
thiserror = "2"
secrecy = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }

# Allocator of the server binary (ADR 0003: freed memory goes back to the OS).
tikv-jemallocator = "0.6"
# Its control interface: the server sets the decay of freed pages from the
# memory pool's pressure (ADR 0003).
tikv-jemalloc-ctl = "0.6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# OTLP traces (server only; the core emits plain `tracing` spans). HTTP/protobuf
# with the blocking reqwest client: no gRPC/tonic tree, no TLS stack.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

# Test / bench
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "mongo", "minio", "mssql_server"] }
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1"
tempfile = "3"
cargo_metadata = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics in a query engine take the whole node down with every in-flight query.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Silent truncation of byte counts is how memory limits get bypassed.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
# Pedantic lints that fight the codebase more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Full debuginfo for ~500 dependencies makes test binaries multi-GB and the
# linker runs out of memory. Line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

# Profile used by the container image and by benchmarks.
[profile.bench]
inherits = "release"
debug = true

# datafusion-distributed 3.0.0 with CodeLake's patch (vendor/datafusion-distributed/PATCHES.md):
# the DataFusion 54 line of the library is frozen upstream (ADR 0011).
[patch.crates-io]
datafusion-distributed = { path = "vendor/datafusion-distributed" }
