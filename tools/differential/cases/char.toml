sql = "SELECT count(*) FROM (SELECT ARRAY[ch] AS a FROM {c}.chp.t WHERE id IN (1, 2)) x, (SELECT ARRAY[CAST('ab' AS char(5))] AS a) y WHERE x.a = y.a"

[[case]]
