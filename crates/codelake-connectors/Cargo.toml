[package]
name = "codelake-connectors"
description = "Source connectors (PostgreSQL, MySQL, SQL Server, MongoDB, Hive)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["postgres", "mysql", "mongodb", "sqlserver", "hive"]
# The federation feature lives in each table-provider crate since 0.13.
postgres = [
  "dep:datafusion-table-providers-common",
  "dep:datafusion-table-providers-postgres",
  "datafusion-table-providers-postgres/federation",
  "dep:datafusion-federation",
  "dep:bb8",
  "dep:bb8-postgres",
  "dep:postgres-native-tls",
  "dep:native-tls",
  "dep:futures",
]
mysql = [
  "dep:datafusion-table-providers-common",
  "dep:datafusion-table-providers-mysql",
  "datafusion-table-providers-mysql/federation",
]
# Not shipped: object_store's S3 client pulls quick-xml 0.39 (RUSTSEC-2026-0194/0195)
# until the DataFusion train moves to object_store >= 0.14 (ROADMAP F11).
hive-s3 = ["hive", "object_store/aws"]
hive = ["dep:object_store", "dep:bytes", "dep:crc32fast", "dep:uuid", "dep:base64", "dep:serde", "dep:serde_json", "dep:futures", "dep:rustix"]
sqlserver = ["dep:tiberius", "dep:bb8", "dep:tokio-util", "dep:futures", "dep:datafusion-federation"]
mongodb = ["dep:datafusion-table-providers-mongodb"]
# No `iceberg` feature: the connector is parked in `parked/iceberg.rs`, outside
# the build (docs/adr/0013).

[dependencies]
codelake-core.workspace = true
datafusion.workspace = true
datafusion-table-providers-common = { workspace = true, optional = true }
datafusion-table-providers-postgres = { workspace = true, optional = true }
datafusion-table-providers-mysql = { workspace = true, optional = true }
datafusion-table-providers-mongodb = { workspace = true, optional = true }
tiberius = { workspace = true, optional = true }
bb8 = { workspace = true, optional = true }
bb8-postgres = { workspace = true, optional = true }
postgres-native-tls = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["compat"] }
futures = { workspace = true, optional = true }
datafusion-federation = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
async-trait.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["minimal"] }
mongodb = "3.6"
tiberius = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
testcontainers.workspace = true
testcontainers-modules.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
