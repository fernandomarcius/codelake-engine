apiVersion: apps/v1
kind: Deployment
metadata:
  name: codelake
  labels: { app.kubernetes.io/name: codelake }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: codelake }
  template:
    metadata:
      labels: { app.kubernetes.io/name: codelake }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45   # > server.shutdown_grace_secs
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: codelake
          image: codelake
          args: ["serve", "--config", "/etc/codelake/codelake.toml"]
          ports:
            - { name: pg, containerPort: 5432 }
            - { name: http, containerPort: 8080 }
          envFrom:
            # Created by the secret manager integration (External Secrets / Vault),
            # never committed to this repository.
            - secretRef: { name: codelake-sources }
          env:
            - { name: RUST_LOG, value: "info" }
          resources:
            # memory.limit (3GiB) is ~75% of the container limit on purpose.
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            # Attaching sources can take up to execution.source_startup_timeout_secs.
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - { name: config, mountPath: /etc/codelake, readOnly: true }
            - { name: spill, mountPath: /var/lib/codelake/spill }
      volumes:
        - name: config
          configMap: { name: codelake-config }
        - name: spill
          # Bounded: spill can never fill the node disk. Keep it > memory.spill_limit.
          emptyDir: { sizeLimit: 50Gi }
