id = "N8"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT count(*) FROM hive.nrg.n1 a LEFT JOIN hive.nrg.n1 b ON a.v IS NOT DISTINCT FROM b.v WHERE b.id IS NULL"

