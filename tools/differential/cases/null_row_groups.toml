# NULL keys in Parquet row groups that hold only NULLs (Trino wrote each INSERT to its own
# file) under null-safe joins, set operations and IS [NOT] DISTINCT FROM; c1 is the same
# data written by CodeLake. Precedence of IS [NOT] DISTINCT FROM against AND/OR.

oracle = "trino"
setup_trino = [
  "CREATE SCHEMA hive.nrg",
  "CREATE TABLE hive.nrg.n1 (id bigint, v varchar) WITH (format = 'PARQUET')",
  "INSERT INTO hive.nrg.n1 VALUES (1, 'a'), (2, 'b')",
  "INSERT INTO hive.nrg.n1 VALUES (3, NULL)",
  "CREATE TABLE hive.nrg.n2 (id bigint, k bigint, d double, b boolean) WITH (format = 'PARQUET')",
  "INSERT INTO hive.nrg.n2 VALUES (1, 10, 1.5E0, true), (2, 20, 2.5E0, false)",
  "INSERT INTO hive.nrg.n2 VALUES (3, NULL, NULL, NULL)",
]
setup_codelake = [
  "CREATE TABLE hive.nrg.c1 (id bigint, v varchar)",
  "INSERT INTO hive.nrg.c1 VALUES (1, 'a'), (2, 'b')",
  "INSERT INTO hive.nrg.c1 VALUES (3, NULL)",
]

[[case]]
id = "N1"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT * FROM hive.nrg.n1 EXCEPT SELECT * FROM hive.nrg.n1"

[[case]]
id = "N2"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT count(*) FROM (SELECT * FROM hive.nrg.n1 INTERSECT SELECT * FROM hive.nrg.n1)"

[[case]]
id = "N3"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT * FROM hive.nrg.n1 INTERSECT SELECT * FROM hive.nrg.n1 ORDER BY id"

[[case]]
id = "N4"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT count(*) FROM hive.nrg.n1 a JOIN hive.nrg.n1 b ON a.v IS NOT DISTINCT FROM b.v"

[[case]]
id = "N5"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT a.id, b.id FROM hive.nrg.n1 a JOIN hive.nrg.n1 b ON a.v IS NOT DISTINCT FROM b.v ORDER BY 1, 2"

[[case]]
id = "N6"
expect = "WRONG"
known = "front/nullsafe-join"
sql = "SELECT id FROM hive.nrg.n1 a WHERE NOT EXISTS (SELECT 1 FROM hive.nrg.n1 b WHERE b.v IS NOT DISTINCT FROM a.v) ORDER BY id"

[[case]]
id = "N7"
expect = "WRONG"
