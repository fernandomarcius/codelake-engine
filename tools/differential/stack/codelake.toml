# CodeLake under test in the differential gate. Reached only on the gate's
# private Docker network, created for the run and removed after it (no port is
# published on the host): the isolated network allow_unauthenticated_network
# asks for.
[server]
pg_listen = "0.0.0.0:5432"
http_listen = "127.0.0.1:8090"
allow_unauthenticated_network = true
shutdown_grace_secs = 1

[server.trino]
listen = "0.0.0.0:8081"
# Clients built for Trino 431 send its header prefix and check its version (ISS-011).
header_prefix = "X-Trino-"
reported_version = "431"

[memory]
limit = "2GiB"
spill_dir = "/tmp/spill"
spill_limit = "2GiB"
metadata_cache_limit = "8MiB"

# The warehouse Trino 431 writes too (hive.properties): files one engine
# writes, the other reads.
[[source]]
name = "hive"
kind = "hive"
warehouse = "/wh"

# Trino 431 shares this warehouse: its file metastore names (ISS-011).
[source.metastore_names]
metadata_file = ".trinoSchema"
permissions_dir = ".trinoPermissions"
view_marker = "Presto View"
view_parameter = "presto_view"
version_parameter = "presto_version"
writer_version = "431"
