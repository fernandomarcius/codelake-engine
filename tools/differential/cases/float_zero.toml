# -0.0 against 0.0 (and NaN) in comparisons, joins, grouping and set operations, over
# Parquet files Trino wrote (pushed-down filters) and over in-memory tables.

oracle = "trino"
setup_trino = [
  "CREATE SCHEMA hive.fz",
  "CREATE TABLE hive.fz.z (id bigint, x double, r real) WITH (format = 'PARQUET')",
  "INSERT INTO hive.fz.z VALUES (1, 0.0E0, REAL '0.0')",
  "INSERT INTO hive.fz.z VALUES (2, -0.0E0, REAL '-0.0')",
  "INSERT INTO hive.fz.z VALUES (3, 1.0E0, REAL '1.0'), (4, -1.0E0, REAL '-1.0')",
  "INSERT INTO hive.fz.z VALUES (5, nan(), CAST(nan() AS real)), (6, NULL, NULL)",
]
setup = [
  "CREATE SCHEMA {c}.fzm",
  "CREATE TABLE {c}.fzm.f (x double, y double, r real)",
  "INSERT INTO {c}.fzm.f VALUES (0.0E0, -0.0E0, REAL '0.0'), (-0.0E0, 0.0E0, REAL '-0.0'), (nan(), nan(), nan()), (1.0E0, 1.0E0, REAL '1.0'), (NULL, 0.0E0, NULL), (-1.0E0, -0.0E0, REAL '-1.0')",
  "CREATE TABLE {c}.fzm.g (x double, tag varchar)",
  "INSERT INTO {c}.fzm.g VALUES (0.0E0, 'pos'), (-0.0E0, 'neg'), (nan(), 'nan')",
]

