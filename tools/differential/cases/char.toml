# CAST of char(n) to varchar is the same on every protocol (ISS-037 round 5 finding); without
# the padding (ISS-059).
[[case]]
id = "R6-pg-cast-varchar"
expect = "WRONG"
accepted = "ISS-059"
note = "CAST(char AS varchar) and its length without the padding, on the PostgreSQL wire too"
protocol = "pg"
sql = "SELECT id, CAST(ch AS varchar) AS v, length(CAST(ch AS varchar)) AS n FROM {c}.chp.t WHERE id IN (1, 2, 7) ORDER BY id"

# Without the padding (ISS-059) char values are still ordered and matched with `LIKE` as the
# reference does, padded: a tab after a common prefix sorts below the padding.
[[case]]
id = "NP1-order-by"
sql = "SELECT i FROM (VALUES (1, CAST('a' AS char(3))), (2, CAST('a' || chr(9) AS char(3))), (3, CAST('a b' AS char(3))), (4, CAST(NULL AS char(3)))) AS t(i, x) ORDER BY x DESC, i"
compare = "ordered"

[[case]]
id = "NP2-min-max"
sql = "SELECT max(x) = 'a', min(x) = 'a' || chr(9), max_by(i, x), min_by(i, x), count(*) FILTER (WHERE x < 'a'), bool_and(greatest(x, CAST('a' AS char(3))) = 'a') FROM (VALUES (1, CAST('a' AS char(3))), (2, CAST('a' || chr(9) AS char(3)))) AS t(i, x)"

[[case]]
id = "NP3-window-like"
sql = "SELECT i, rank() OVER (ORDER BY x), x LIKE 'a%', x LIKE 'a _', x LIKE '%' || chr(9) || ' ' FROM (VALUES (1, CAST('a' AS char(3))), (2, CAST('a' || chr(9) AS char(3)))) AS t(i, x) ORDER BY i"

[[case]]
id = "NP4-table-like"
sql = "SELECT id, ch LIKE 'a %', ch LIKE 'ab', c3 LIKE '%  ', ch < c3 FROM {c}.chp.t ORDER BY id"
