# Unit tests are the fast lane (no Docker). Integration tests live in `tests/`
# directories and need Docker; they run in the `integration` profile.
[profile.default]
default-filter = "not kind(test)"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.integration]
default-filter = "kind(test)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
# Containers are heavy; do not start dozens at once.
test-threads = 4

[profile.ci]
fail-fast = false
[profile.ci.junit]
path = "junit.xml"

# One SQL Server and one Trino 431 for ~130 statements on each engine
# (sqlserver_federated_joins.rs): about 3.5 minutes, the default's limit is 5.
[[profile.integration.overrides]]
filter = "test(federated_joins_answer_as_the_reference_engine)"
slow-timeout = { period = "60s", terminate-after = 10 }
